name: AI Commit Reviewer (Flash Lite)

on:
  push:
    # Run on all branches (or you can specify only master: [master])
    branches:
      - '**'

jobs:
  review_commit:
    # Skip commit if its message contains markers as indicated below
    if: >
      !contains(lower(github.event.head_commit.message), 'minor:') &&
      !contains(lower(github.event.head_commit.message), 'chore:') &&
      !contains(lower(github.event.head_commit.message), 'docs:') &&
      !contains(lower(github.event.head_commit.message), 'skip-ai')
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for adding comments to a commit

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Download the current and previous commits for comparison

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install google-genai requests

      - name: Extract Commit Diff
        # Get changes from the current commit only, excluding binaries and markdown
        run: |
          git diff HEAD~1 HEAD -- . ':!*.json' ':!*.lock' ':!*.md' > commit_diff.txt

      - name: Run AI Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
          REPO_FULL_NAME: ${{ github.repository }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: python .github/scripts/ai_commit_review.py
